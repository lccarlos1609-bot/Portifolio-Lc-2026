    html, body {
        width: 100%;

        background-color: #000;
        overflow-x: hidden;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
    }

    ::-webkit-scrollbar {
        display: none;
    }

    .slide-container {
        width: 100vw;
        height: 100vh;
        position: relative;
        scroll-snap-align: start;
    }

    .slide-container img {
